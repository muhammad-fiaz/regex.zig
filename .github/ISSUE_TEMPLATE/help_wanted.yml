name: Help Wanted
description: Ask for assistance or guidance on using regex.zig
labels: ['question', 'help wanted']
body:
  - type: markdown
    attributes:
      value: |
        Need help using regex.zig? Please describe your question or use case.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Pattern & Context
      description: Any relevant regular expression patterns, input samples, or configuration

  - type: input
    id: version
    attributes:
      label: regex.zig Version
      placeholder: "0.0.1"

  - type: input
    id: zig-version
    attributes:
      label: Zig Version
      placeholder: "0.17.0"
