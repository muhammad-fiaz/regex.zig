name: Feature Request
description: Suggest an enhancement or new feature for regex.zig
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for regex.zig! Please describe your proposal.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or capability
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why would this feature be useful for regex.zig users?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Core Engine (PikeVM / NFA)
        - Parser & Syntax
        - Unicode & Case Folding
        - Captures & Submatches
        - Replacement & Splitting
        - Performance & Benchmarking
        - Documentation
        - Other
    validations:
      required: true
